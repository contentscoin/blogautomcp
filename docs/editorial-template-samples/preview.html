<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>발행급 편집 템플릿 미리보기</title>
  <style>
    :root {
      --paper: #ffffff;
      --ink: #333333;
      --muted: #555555;
      --line: #e8ecef;
      --shell: #e9eef1;
      --chip: #f4f7f8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background:
        radial-gradient(1200px 600px at 10% -10%, #dfe8ec 0%, transparent 55%),
        radial-gradient(900px 500px at 100% 0%, #e7ebe4 0%, transparent 50%),
        var(--shell);
      color: var(--ink);
      font-family: "Nanum Gothic", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    }
    .page {
      max-width: 1120px;
      margin: 0 auto;
      padding: 28px 18px 64px;
      display: grid;
      gap: 20px;
      grid-template-columns: 300px minmax(0, 420px) minmax(220px, 1fr);
      align-items: start;
    }
    @media (max-width: 980px) {
      .page { grid-template-columns: 1fr; max-width: 460px; }
      .side-note { order: 3; }
    }
    .panel, .phone, .side-note {
      background: var(--paper);
      border-radius: 22px;
      box-shadow: 0 18px 50px rgba(20, 35, 45, 0.08);
    }
    .panel { padding: 20px 18px; position: sticky; top: 16px; }
    .panel h1 { margin: 0 0 8px; font-size: 20px; line-height: 1.35; letter-spacing: -0.02em; }
    .panel .lead { margin: 0 0 16px; font-size: 13px; line-height: 1.65; color: var(--muted); }
    .tabs { display: grid; gap: 8px; }
    .tabs button {
      text-align: left;
      border: 1px solid #d7dee3;
      background: #fff;
      border-radius: 14px;
      padding: 12px 12px;
      cursor: pointer;
      font: inherit;
      font-size: 13px;
      line-height: 1.4;
    }
    .tabs button small { display: block; margin-top: 3px; color: var(--muted); font-size: 11px; }
    .tabs button[aria-pressed="true"] {
      border-color: var(--accent);
      background: color-mix(in srgb, var(--accent) 8%, white);
      box-shadow: inset 3px 0 0 var(--accent);
    }
    .meta-grid { margin-top: 16px; display: grid; gap: 10px; }
    .meta-grid div {
      padding: 10px 12px;
      border-radius: 12px;
      background: var(--chip);
      font-size: 12px;
      line-height: 1.5;
    }
    .meta-grid strong { display: block; font-size: 11px; color: var(--muted); font-weight: 600; margin-bottom: 2px; }
    .swatch { width: 12px; height: 12px; border-radius: 3px; display: inline-block; vertical-align: -1px; margin-right: 5px; }

    .phone {
      width: min(100%, 420px);
      margin: 0 auto;
      overflow: hidden;
      border: 1px solid #dbe2e7;
    }
    .phone-top {
      padding: 14px 18px 10px;
      border-bottom: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      color: var(--muted);
      background: linear-gradient(180deg, #fbfcfd, #fff);
    }
    .status-dot { width: 7px; height: 7px; border-radius: 50%; background: #34c759; display: inline-block; margin-right: 6px; }
    .article { padding: 22px 20px 34px; }
    .badge-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
    .badge {
      font-size: 11px;
      letter-spacing: 0.02em;
      color: var(--accent);
      background: color-mix(in srgb, var(--accent) 10%, white);
      border: 1px solid color-mix(in srgb, var(--accent) 22%, white);
      border-radius: 999px;
      padding: 5px 10px;
    }
    .article > h2 {
      margin: 0 0 10px;
      font-size: 23px;
      line-height: 1.4;
      letter-spacing: -0.03em;
      color: #1b1f23;
    }
    .dek {
      margin: 0 0 16px;
      font-size: 14px;
      line-height: 1.7;
      color: var(--muted);
    }
    .verdict {
      margin: 0 0 22px;
      padding: 14px 14px 14px 16px;
      border-left: 3px solid var(--accent);
      background: color-mix(in srgb, var(--accent) 6%, white);
      border-radius: 0 14px 14px 0;
      font-size: 14px;
      line-height: 1.7;
    }
    .verdict strong { color: var(--accent); }
    .rule {
      border: 0;
      border-top: 1px solid var(--line);
      margin: 26px 0;
    }
    .article h3 {
      margin: 0 0 12px;
      font-size: 19px;
      line-height: 1.45;
      color: var(--accent);
      letter-spacing: -0.02em;
    }
    .article p {
      margin: 0 0 16px;
      font-size: 16px;
      line-height: 1.8;
      color: var(--ink);
      text-align: left;
      overflow-wrap: anywhere;
    }
    .photo {
      margin: 8px 0 6px;
      aspect-ratio: 4 / 3;
      border-radius: 14px;
      display: grid;
      place-items: end start;
      padding: 14px;
      color: #fff;
      font-size: 12px;
      line-height: 1.4;
      font-weight: 600;
      text-shadow: 0 1px 8px rgba(0,0,0,.35);
      background:
        linear-gradient(180deg, transparent 35%, rgba(0,0,0,.45)),
        linear-gradient(135deg, color-mix(in srgb, var(--accent) 55%, #8aa), color-mix(in srgb, var(--accent) 25%, #ddd));
    }
    .caption {
      margin: 0 0 18px;
      font-size: 13px;
      line-height: 1.65;
      color: var(--muted);
    }
    .stack {
      display: grid;
      gap: 10px;
      margin: 0 0 18px;
    }
    .card {
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 12px 13px;
      background: #fafbfc;
    }
    .card .kicker {
      font-size: 11px;
      color: var(--accent);
      font-weight: 700;
      margin-bottom: 4px;
    }
    .card p { margin: 0; font-size: 14px; line-height: 1.65; }
    .fit-grid {
      display: grid;
      gap: 10px;
      margin: 0 0 18px;
    }
    .fit {
      border-radius: 14px;
      padding: 13px;
      border: 1px solid var(--line);
    }
    .fit.good { background: #f3faf6; border-color: #cfe6d8; }
    .fit.care { background: #fbf7f2; border-color: #ead9c8; }
    .fit h4 { margin: 0 0 6px; font-size: 13px; }
    .fit ul { margin: 0; padding-left: 18px; font-size: 13px; line-height: 1.65; color: #444; }
    .cta {
      margin: 22px 0 8px;
      padding: 16px;
      border-radius: 16px;
      background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 12%, white), #fff);
      border: 1px solid color-mix(in srgb, var(--accent) 25%, white);
      text-align: center;
    }
    .cta .price { font-size: 18px; font-weight: 800; color: var(--accent); margin-bottom: 4px; }
    .cta .sub { font-size: 12px; color: var(--muted); margin-bottom: 12px; }
    .cta .btn {
      display: inline-block;
      padding: 11px 18px;
      border-radius: 999px;
      background: var(--accent);
      color: #fff;
      font-size: 13px;
      font-weight: 700;
    }
    .tags { margin: 18px 0 10px; font-size: 13px; line-height: 1.7; color: var(--accent); }
    .disclose {
      margin: 0;
      font-size: 12px;
      line-height: 1.65;
      color: var(--muted);
      padding-top: 8px;
      border-top: 1px dashed var(--line);
    }
    .side-note { padding: 18px; }
    .side-note h2 { margin: 0 0 8px; font-size: 15px; }
    .side-note p, .side-note li { font-size: 12px; line-height: 1.65; color: var(--muted); }
    .side-note ul { margin: 0; padding-left: 18px; }
    .side-note li { margin-bottom: 6px; }
  </style>
</head>
<body>
  <div class="page" style="--accent:#00554c">
    <aside class="panel">
      <h1>발행급 템플릿 미리보기</h1>
      <p class="lead">Instapaper·리뷰형 모바일 아티클의 읽기 리듬을 참고해, 네이버 지원 값(나눔고딕·16/19px·왼쪽 정렬·강조색 1개) 안에서 구성했습니다.</p>

      <div class="meta-grid" id="meta"></div>

      <article class="article" id="article"></article>
    </main>

    <aside class="side-note">
      <h2>레이아웃 참고 포인트</h2>
      <ul>
        <li>상단 짧은 결론/판정 카드로 첫 화면 이해</li>

        <li>추천/비추천을 분리한 fit 블록</li>
        <li>하단 커넥트 CTA·고지 고정</li>
      </ul>
      <p style="margin-top:14px">마크다운 원문: <code>docs/editorial-template-samples/*.md</code></p>
    </aside>
  </div>

const tabs = document.getElementById("tabs");
const article = document.getElementById("article");
const meta = document.getElementById("meta");
const page = document.querySelector(".page");

function renderBlocks(blocks) {
  return blocks.map((b) => {
    if (b.type === "p") return `<p>${b.text}</p>`;
    if (b.type === "h") return `<h3>${b.text}</h3>`;
    if (b.type === "rule") return `<hr class="rule" />`;
    if (b.type === "photo") return `<div class="photo">${b.label}</div><p class="caption">이미지 자리 · 실제 상품/일정 근거 원본 사용</p>`;
    if (b.type === "cards") return `<div class="stack">${b.items.map(i => `<div class="card"><div class="kicker">${i.k}</div><p>${i.t}</p></div>`).join("")}</div>`;
    if (b.type === "fit") return `<div class="fit-grid"><div class="fit good"><h4>${b.goodTitle}</h4><ul>${b.good.map(x=>`<li>${x}</li>`).join("")}</ul></div><div class="fit care"><h4>${b.careTitle}</h4><ul>${b.care.map(x=>`<li>${x}</li>`).join("")}</ul></div></div>`;
    if (b.type === "cta") return `<div class="cta"><div class="price">${b.price}</div><div class="sub">${b.sub}</div><div class="btn">${b.btn}</div></div>`;
    if (b.type === "tags") return `<p class="tags">${b.text}</p>`;
    if (b.type === "disclose") return `<p class="disclose">${b.text}</p>`;
    return "";
  }).join("");
}

function render(i) {
  const t = T[i];
  page.style.setProperty("--accent", t.accent);
  meta.innerHTML = `
    <div><strong>템플릿 ID</strong><code>${t.id}</code></div>
    <div><strong>강조색</strong><span class="swatch" style="background:${t.accent}"></span>${t.accent}</div>
    <div><strong>상품/주제</strong>${t.product}</div>
    <div><strong>이미지 규칙</strong>${t.imageRule}</div>
    <div><strong>말투</strong>${t.tone}</div>`;
  article.innerHTML = `
    <div class="badge-row"><span class="badge">${t.label}</span><span class="badge">${t.kind}</span><span class="badge">발행급 시안</span></div>
    <h2>${t.title}</h2>
    <p class="dek">${t.dek}</p>
    <div class="verdict">${t.verdict}</div>
    ${renderBlocks(t.blocks)}`;
  [...tabs.children].forEach((btn, j) => btn.setAttribute("aria-pressed", String(j === i)));
}

T.forEach((t, i) => {
  const btn = document.createElement("button");
  btn.type = "button";
  btn.innerHTML = `${t.label}<small>${t.sub}</small>`;
  btn.onclick = () => render(i);
  tabs.append(btn);
});
render(0);
