name: Desktop Build

# 설치형 앱(Windows nsis / macOS dmg) 빌드.
# - 수동 실행(workflow_dispatch) 또는 v* 태그 푸시 시 동작
# - 코드서명은 시크릿(CSC_LINK/CSC_KEY_PASSWORD)이 있을 때만. 없으면 미서명 산출물.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "설치파일을 업로드할 기존 릴리스 태그 (비우면 업로드 안 함)"
        required: false
        default: ""
  push:
    tags:
      - "v*"

jobs:
  build:
    permissions:
      contents: write   # 태그 빌드 시 릴리스에 설치파일 업로드
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            pack: desktop:pack:win
            artifact: windows-installer
            glob: "out/*.exe"
          - os: macos-latest
            pack: desktop:pack:mac
            artifact: macos-dmg
            glob: "out/*.dmg"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # lockfile을 지우고 npm install: 한 플랫폼에서 생성된 lockfile이 다른 OS의 네이티브
      # optional deps(lightningcss-win32 등)를 누락시키는 npm 버그(#4828)를 회피하기 위해,
      # 각 러너에서 플랫폼에 맞게 새로 해석해 설치한다.
      - name: Install dependencies
        shell: bash
        run: |
          rm -f package-lock.json
          npm install --no-audit --no-fund

      # prisma generate는 build 스크립트에 포함되어 OS별 엔진(binaryTargets)을 받는다.
      # asar:false로 node_modules를 통째 복사하므로 파일 디스크립터 한계를 올린다(macOS EMFILE 방지).
      - name: Build installer
        shell: bash
        run: |
          ulimit -n 65536 2>/dev/null || true
          npm run ${{ matrix.pack }}
        env:
          # CI에는 코드서명 인증서가 없으므로 서명을 건너뛴다(미서명 산출물).
          # 빈 CSC_LINK("")를 넘기면 electron-builder가 빈 인증서로 서명을 시도해
          # macOS에서 'not a file'로 실패하므로, CSC_* 환경변수는 넘기지 않는다.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload installer (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.glob }}
          if-no-files-found: error

      # 태그(v*) 트리거 시 또는 수동 실행 시 release_tag 입력이 있으면 릴리스에 자동 첨부.
      - name: Attach installer to release
        if: github.ref_type == 'tag' || inputs.release_tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REL_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag }}
        run: gh release upload "$REL_TAG" ${{ matrix.glob }} --repo "${{ github.repository }}" --clobber
