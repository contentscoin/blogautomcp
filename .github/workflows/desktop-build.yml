name: Desktop Build

# 설치형 앱(Windows nsis / macOS dmg) 빌드.
# - 수동 실행(workflow_dispatch) 또는 v* 태그 푸시 시 동작
# - 코드서명은 시크릿(CSC_LINK/CSC_KEY_PASSWORD)이 있을 때만. 없으면 미서명 산출물.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "설치파일을 업로드할 기존 릴리스 태그 (비우면 업로드 안 함)"
        required: false
        default: ""
  push:
    tags:
      - "v*"

jobs:
  build:
    permissions:
      contents: write   # 태그 빌드 시 릴리스에 설치파일 업로드
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            pack: desktop:pack:win
            artifact: windows-installer
            # 자동업데이트 채널에 올릴 파일까지 포함: 설치본 + blockmap + latest.yml
            glob: "out/*.exe\nout/*.blockmap\nout/latest.yml"
          - os: macos-latest
            pack: desktop:pack:mac
            artifact: macos-dmg
            glob: "out/*.dmg"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # lockfile을 지우고 npm install: 한 플랫폼에서 생성된 lockfile이 다른 OS의 네이티브
      # optional deps(lightningcss-win32 등)를 누락시키는 npm 버그(#4828)를 회피하기 위해,
      # 각 러너에서 플랫폼에 맞게 새로 해석해 설치한다.
      - name: Install dependencies
        shell: bash
        run: |
          rm -f package-lock.json
          npm install --no-audit --no-fund

      # prisma generate는 build 스크립트에 포함되어 OS별 엔진(binaryTargets)을 받는다.
      # asar:false로 node_modules를 통째 복사하므로 파일 디스크립터 한계를 올린다(macOS EMFILE 방지).
      - name: Build installer
        shell: bash
        run: |
          ulimit -n 65536 2>/dev/null || true
          npm run ${{ matrix.pack }}
        env:
          # CI에는 코드서명 인증서가 없으므로 서명을 건너뛴다(미서명 산출물).
          # 빈 CSC_LINK("")를 넘기면 electron-builder가 빈 인증서로 서명을 시도해
          # macOS에서 'not a file'로 실패하므로, CSC_* 환경변수는 넘기지 않는다.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload installer (artifact)
        uses: actions/upload-artifact@v4
        # 아티팩트 저장소 쿼터 초과로 실패해도 릴리스 업로드는 진행되도록 한다.
        continue-on-error: true
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.glob }}
          if-no-files-found: error

      # 수동 실행 시 릴리스가 아직 없으면 생성한다(GITHUB_TOKEN 생성 이벤트는
      # 다른 워크플로를 재트리거하지 않아 태그 빌드가 중복 실행되지 않는다).
      - name: Ensure release exists
        if: github.ref_type == 'tag' || inputs.release_tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REL_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag }}
        run: |
          gh release create "$REL_TAG" --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "BrandConnect Automation $REL_TAG" \
            --notes "자동 빌드 릴리스 ($REL_TAG)" || true

      # 태그(v*) 트리거 시 또는 수동 실행 시 release_tag 입력이 있으면 릴리스에 자동 첨부.
      - name: Attach installer to release
        if: github.ref_type == 'tag' || inputs.release_tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REL_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag }}
        run: |
          FILES=$(printf '%s' "${{ matrix.glob }}" | tr '\n' ' ')
          gh release upload "$REL_TAG" $FILES --repo "${{ github.repository }}" --clobber

      # 릴리스 빌드를 중앙 자동업데이트 채널에도 게시한다. 설치된 앱은 GitHub
      # 릴리스가 아니라 이 채널(latest.yml)을 보므로, 여기 게시돼야 자동업데이트가
      # 동작한다. INSTALLER_UPLOAD_KEY 시크릿이 없으면 경고만 남기고 건너뛴다.
      - name: Publish to auto-update channel
        if: matrix.os == 'windows-latest' && (github.ref_type == 'tag' || inputs.release_tag != '')
        shell: bash
        env:
          INSTALLER_UPLOAD_KEY: ${{ secrets.INSTALLER_UPLOAD_KEY }}
        run: |
          if [ -z "$INSTALLER_UPLOAD_KEY" ]; then
            echo "::warning::INSTALLER_UPLOAD_KEY 시크릿이 없어 자동업데이트 채널 게시를 건너뜁니다. Settings → Secrets and variables → Actions에 추가하면 릴리스 빌드가 채널까지 자동 게시됩니다."
            exit 0
          fi
          SITE_URL=$(node -p "new URL(require('./package.json').build.publish[0].url).origin")
          node apps/sites/scripts/publish-update.mjs "$SITE_URL" out
